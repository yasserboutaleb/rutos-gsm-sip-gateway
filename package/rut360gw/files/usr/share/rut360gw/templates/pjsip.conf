; rut360gw — PJSIP. Template: rut360gw-config fills in the values (and secrets) from
; /etc/config/rut360gw and removes the disabled blocks (#BEGIN/#END).
; SIP/RTP are reachable from the LAN (rate limited by the firewall, rut360gw-fw) and, when a remote
; SIP server is reached through a RutOS VPN, from that VPN; the wan zone (4G) rejects all incoming traffic.

[global]
type = global
user_agent = rut360gw
keep_alive_interval = 30

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

;#BEGIN local — SIP client on the LAN (rut360gw.local.password not empty). The endpoint and its AOR are
; named after local.username: a softphone is identified by the user of its From header and registers
; the AOR of its To header, both set to its username (a fixed section name left a softphone
; configured as documented unidentified: endless 401).
[@SIP_USER@]
type = endpoint
context = from-sip
disallow = all
allow = alaw,ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
auth = local-auth
aors = @SIP_USER@
message_context = sms-out
rtp_timeout = 60         ; answered call with no RTP received for 60 s: hung up (lost client, the GSM call would stay open)
;#BEGIN lanacl — accepted only from the LAN subnet (and the loopback)
deny = 0.0.0.0/0.0.0.0
permit = @LAN_NET@
permit = 127.0.0.1/255.255.255.255
;#END lanacl

[local-auth]
type = auth
auth_type = userpass
username = @SIP_USER@
password = @SIP_PASSWORD@

[@SIP_USER@]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
;#END local

;#BEGIN server — remote SIP server (rut360gw.server: Asterisk, FreePBX...)
[server-aor]
type = aor
contact = sip:@SERVER_HOST@:@SERVER_PORT@
qualify_frequency = 60

[server]
type = endpoint
context = from-server
message_context = sms-out
disallow = all
allow = @SERVER_CODEC@
aors = server-aor
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733
; If the server or the network goes down during a call, no BYE arrives: without this timeout, the
; GSM call stayed open (and charged) until the other party hung up. Only counts once the call is
; answered (Asterisk 18 ignores the ringing phase); putting the call on hold is not affected.
rtp_timeout = 60
; Identified by its address (ip mode) or by its registration line (register mode: the line
; parameter of the registered contact), never by the user of the From header: with the default
; (username,ip), a LAN client sending "From: server" was taken for the server, without a password
; (GSM calls and SMS).
identify_by = ip
;#BEGIN register — the gateway presents itself with its account: From = username, GSM caller's
; number as display name and in P-Asserted-Identity
outbound_auth = server-auth
from_user = @SERVER_USER@
from_domain = @SERVER_HOST@
send_pai = yes
force_rport = yes
rewrite_contact = yes
;#END register

;#BEGIN ip — trusted peer (VPN): identified by its address, without authentication
[server-identify]
type = identify
endpoint = server
match = @SERVER_HOST@
;#END ip

;#BEGIN register
[server-auth]
type = auth
auth_type = userpass
username = @SERVER_USER@
password = @SERVER_PASSWORD@

; Registration with the server: it sends its calls to the gateway's contact address, even behind
; the 4G NAT (line: requests received on this line are attributed to the server endpoint).
[server-reg]
type = registration
outbound_auth = server-auth
server_uri = sip:@SERVER_HOST@:@SERVER_PORT@
client_uri = sip:@SERVER_USER@@@SERVER_HOST@:@SERVER_PORT@
contact_user = @SERVER_USER@
line = yes
endpoint = server
expiration = 300
retry_interval = 60
forbidden_retry_interval = 600
max_retries = 1000000
;#END register
;#END server
