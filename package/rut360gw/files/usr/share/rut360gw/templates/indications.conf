; rut360gw — call progress tones (excerpt of the indications.conf shipped with Asterisk 18).
; Required: the chan_quectel driver signals "progress" as soon as the number is dialled, so the
; RUT360 sends a 183 with early media; when the remote party rings, a 180 is no longer possible
; and Asterisk must generate the ringback tone itself in that media.
; Without this file: silence until the call is answered.
; Country: rut360gw.main.country (fr, dz here; rut360gw-config also adds every country of the
; indications.conf shipped with Asterisk when it is present in the runtime).

[general]
country=@COUNTRY@

[fr]
description = France
ringcadence = 1500,3500
dial = 440
busy = 440/500,0/500
ring = 440/1500,0/3500
congestion = 440/250,0/250
callwait = 440/300,0/10000
dialrecall = !350+440/100,!0/100,!350+440/100,!0/100,!350+440/100,!0/100,350+440
record = 1400/500,0/15000
info = !950/330,!1400/330,!1800/330
stutter = !440/100,!0/100,!440/100,!0/100,!440/100,!0/100,!440/100,!0/100,!440/100,!0/100,!440/100,!0/100,440

[dz]
; Algeria — missing from the Asterisk indications.conf. Usual ITU-T E.180 values (425 Hz),
; not yet verified by ear on an Algerian network.
description = Algeria
ringcadence = 1500,3500
dial = 425
busy = 425/500,0/500
ring = 425/1500,0/3500
congestion = 425/250,0/250
callwait = 425/200,0/600,425/200,0/10000
dialrecall = 425
record = 1400/500,0/15000
info = !950/330,!1400/330,!1800/330
stutter = !425/100,!0/100,!425/100,!0/100,!425/100,!0/100,425
