; chan_quectel — Quectel EG06-E on RUT360/RutOS ("rutos coexistence" build)
; Ports detected automatically by rut360gw-config (modem @USB_ID@):
;   interface @AUDIO_IF@ (NMEA) = @AUDIO_TTY@ -> serial PCM audio (AT+QPCMV=1,0, 8 kHz/16 bits)
;   interface 2 (AT)   = RutOS gsmd port (URC, SMS)  [NEVER USE]
;   interface @DATA_IF@ (AT)   = @DATA_TTY@ -> chan_quectel call control

[general]
interval = 15

[defaults]
context = from-gsm
group = 0
rxgain = -1
txgain = -1
autodeletesms = no
resetmodem = no          ; no ATZ: do not reset the state shared with gsmd
usecallingpres = no
callwaiting = auto      ; do NOT change call waiting on the operator side (AT+CCWA)
multiparty = no
dtmf = off
dsci = off
qhup = yes
initstate = start

; --- options added by the rut360 patch ---
sms = off                ; SMS remain owned by RutOS (gsmd/sms_utils)
urc_cfg = off            ; do not change +QINDCFG (modem-wide, URCs routed to gsmd)
shared_cfg = off         ; do not change CSCS/CMEE/CSSN/VTD/COPS/CREG/CEREG/QTONEDET (modem-wide, owned by gsmd)
clcc_poll = @CLCC_POLL@         ; call tracking by AT+CLCC polling (ms)

[eg06]
audio = @AUDIO_TTY@
data = @DATA_TTY@
uac = off
slin16 = off
