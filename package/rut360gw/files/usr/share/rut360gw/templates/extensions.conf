; rut360gw — minimal dialplan
[general]
static = yes
writeprotect = yes

[globals]
GSM_DEV = eg06
GSM_ECHO_TEST = 0      ; 1 = incoming GSM calls are answered and echoed back (audio test)
SERVER_ON = @SERVER_ON@        ; remote SIP server enabled (rut360gw.server)
SERVER_MODE = @SERVER_MODE@    ; register or ip
SERVER_HOST = @SERVER_HOST@
SERVER_PORT = @SERVER_PORT@
SERVER_EXT = @SERVER_EXT@      ; server extension that receives incoming GSM calls, SMS and USSD replies
SERVER_USER = @SERVER_USER@    ; gateway account (register mode)
LOCAL_ADDR = @LOCAL_ADDR@      ; ip mode: gateway address inside the VPN (domain of the SMS From header)
LOCAL_ON = @LOCAL_ON@          ; LAN SIP client enabled (endpoint named after local.username)
GSM_IN_DIAL = @GSM_IN_DIAL@    ; destinations of incoming GSM calls (features.gsm_in)
USSD_ENABLED = @USSD_ENABLED@
RINGBACK = @RINGBACK_OPT@      ; "r" = ringback tone generated by the gateway (features.ringback=local); empty = the network's own

; Incoming GSM/VoLTE calls -> Linphone
[from-gsm]
exten => s,1,NoOp(Incoming GSM call from ${CALLERID(num)})
 same => n,Set(EVNUM=${FILTER(+0123456789,${CALLERID(num)})})
 same => n,GotoIf($["${GSM_ECHO_TEST}" = "1"]?echo)
; The GSM call is answered ONLY when Linphone answers: the caller hears the ringback of their own
; network, is not charged while nobody answers, and reaches the operator's voicemail if there is
; no answer (same behaviour as an ordinary phone).
; (RutOS 7.14 Call Utilities can hang up incoming calls by itself: see rut360gw-rutos.)
; In register mode, the From header carries the gateway account: the caller's number is sent as the
; display name (and in P-Asserted-Identity, send_pai).
 same => n,GotoIf($["${GSM_IN_DIAL}" = ""]?occupe)
 same => n,GotoIf($["${SERVER_MODE}" != "register"]?dial)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n(dial),Dial(${GSM_IN_DIAL},60)
; Destination unreachable (not registered, server or network down) or busy: rejected as "busy"
; (cause 17, AT+QHUP=17), like a phone that declines the call. The operator then applies call
; forwarding on busy (voicemail) instead of a plain hang-up. No answer (60 s): normal hang-up.
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION" | "${DIALSTATUS}" = "BUSY"]?occupe)
 same => n,Hangup()
 same => n(occupe),Hangup(17)
 same => n(echo),Answer()
 same => n,Echo()
exten => _[+0-9].,1,Goto(s,1)
; Event log (Logs tab of the web page): one line per finished call, number masked as for SMS,
; Dial result and talk time. EVNUM only contains digits and "+".
exten => h,1,GotoIf($["${EVNUM}" = "" | "${DIALSTATUS}" = ""]?fin)
 same => n,System(logger -t rut360gw-call "in ${EVNUM:0:4}... ${DIALSTATUS} ${ANSWEREDTIME}")
 same => n(fin),NoOp()

; Outgoing calls Linphone -> mobile network (national numbers or +international)
[from-sip]
exten => _[+0-9].,1,NoOp(Outgoing SIP call to ${EXTEN})
 same => n,Set(EVNUM=${FILTER(+0123456789,${EXTEN})})
; only the filtered number is dialled: a "&" or "," in the URI would add a channel or Dial options
 same => n,GotoIf($[${LEN(${EVNUM})} != ${LEN(${EXTEN})}]?refus)
 same => n,Dial(Quectel/${GSM_DEV}/${EVNUM},120,${RINGBACK})
 same => n(refus),Hangup()
exten => h,1,GotoIf($["${EVNUM}" = "" | "${DIALSTATUS}" = ""]?fin)
 same => n,System(logger -t rut360gw-call "out ${EVNUM:0:4}... ${DIALSTATUS} ${ANSWEREDTIME}")
 same => n(fin),NoOp()
; internal test number: local echo (checks the RTP path Linphone <-> RUT360 at no GSM cost)
exten => 600,1,Answer()
 same => n,Echo()

; OUTGOING call tests without a second phone (triggered by scripts/test-gsm-outgoing.sh)
; Records 20 s of DOWNLINK audio (network -> RUT360) then hangs up.
; No DTMF is sent: towards a voicemail, keys could play or DELETE messages.
[gsm-test]
exten => probe,1,NoOp(Outgoing test ${CALLERID(dnid)})
 same => n,Record(/tmp/rut360gw/rec/downlink.alaw,0,20,qxk)
 same => n,Hangup()

; Calls coming from the remote SIP server (softphone -> server -> gateway -> mobile network)
[from-server]
; USSD (Linphone dials *code): confirmation beep, the reply is sent back as a MESSAGE.
; Code filtered (digits, * and #); a possible %23 is converted to #.
exten => _[*#].,1,GotoIf($["${USSD_ENABLED}" != "1"]?refus)
 same => n,Set(USSD=${FILTER(0123456789*#,${STRREPLACE(EXTEN,%23,#)})})
 same => n,Set(RAW=${STRREPLACE(EXTEN,%23,#)})
 same => n,GotoIf($[${LEN(${USSD})} != ${LEN(${RAW})}]?refus)
 same => n,System(@SBIN@/rut360gw-sms ussd ${USSD} >/dev/null 2>&1 &)
 same => n,Answer()
 same => n,Playtones(info)
 same => n,Wait(2)
 same => n(refus),Hangup()
; 9600 = local echo of the gateway (server <-> gateway test without GSM; exact match, takes precedence)
exten => 9600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => _[+0-9].,1,NoOp(server -> GSM ${EXTEN})
 same => n,Set(EVNUM=${FILTER(+0123456789,${EXTEN})})
; only the filtered number is dialled: a "&" or "," in the URI would add a channel or Dial options
 same => n,GotoIf($[${LEN(${EVNUM})} != ${LEN(${EXTEN})}]?refus)
 same => n,Dial(Quectel/${GSM_DEV}/${EVNUM},120,${RINGBACK})
 same => n(refus),Hangup()
exten => h,1,GotoIf($["${EVNUM}" = "" | "${DIALSTATUS}" = ""]?fin)
 same => n,System(logger -t rut360gw-call "out ${EVNUM:0:4}... ${DIALSTATUS} ${ANSWEREDTIME}")
 same => n(fin),NoOp()


; ---------------------------------------------------------------- SMS <-> SIP bridge
; SIP MESSAGE (softphone through the server, or LAN client) to a number -> SMS sent by RutOS (gsmctl).
; The number is filtered (digits and + only); the text is passed base64-encoded to rut360gw-sms.
[sms-out]
exten => _[+0-9].,1,NoOp(sms-out: exten=${EXTEN} to=${MESSAGE(to)} from=${MESSAGE(from)} length=${LEN(${MESSAGE(body)})})
 same => n,Set(NUM=${FILTER(+0123456789,${EXTEN})})
; lengths compared, not strings: a " in EXTEN would break a string expression
 same => n,GotoIf($[${LEN(${NUM})} != ${LEN(${EXTEN})}]?echec)
 same => n,Set(B64=${BASE64_ENCODE(${MESSAGE(body)})})
 same => n,System(@SBIN@/rut360gw-sms send ${NUM} ${B64})
 same => n,NoOp(sms-out: sending to ${NUM} = ${SYSTEMSTATUS})
 same => n,GotoIf($["${SYSTEMSTATUS}" = "SUCCESS"]?fin)
 same => n(echec),NoOp(sms-out: failed exten=${EXTEN} num=${NUM} status=${SYSTEMSTATUS})
 same => n,Set(MESSAGE(body)=SMS to ${NUM} could not be sent)
 same => n,Set(MSGFROM=gsm-rut360)
 same => n,Set(MSGID=)
 same => n,Goto(msg-to-sip,s,1)
 same => n(fin),Hangup()

; Received SMS (or USSD reply) -> SIP MESSAGE. Triggered by rut360gw-sms (Local channel); the text
; and the sender are read from the AstDB under rut360sms/<id>_*.
[sms-to-sip]
exten => _X.,1,NoOp(SMS received -> SIP (${EXTEN}))
 same => n,Set(MESSAGE(body)=${BASE64_DECODE(${DB(rut360sms/${EXTEN}_b64)})})
 same => n,Set(FROMNUM=${DB(rut360sms/${EXTEN}_from)})
 same => n,Set(MSGFROM=${FROMNUM})
 same => n,Set(MSGID=${EXTEN})
 same => n,Goto(msg-to-sip,s,1)

; Sends a SIP MESSAGE (body already in MESSAGE(body)) on behalf of MSGFROM (number or name):
; to the SIP server if it is enabled, otherwise to the LAN SIP client. If MSGID is set (received
; SMS), the result is written to the AstDB (rut360sms/<MSGID>_status). Reached with Goto (no Gosub:
; app_stack is not in the runtime).
;  - ip mode: From = <sip:MSGFROM@gateway address inside the VPN> (the server reads the number from
;    the From user part);
;  - register mode: From = MSGFROM <sip:account@server> (the server recognises the gateway by its
;    account, the number is the display name).
[msg-to-sip]
exten => s,1,GotoIf($["${SERVER_ON}" != "1"]?local)
 same => n,Set(MESSAGE(to)=sip:${SERVER_EXT}@${SERVER_HOST})
 same => n,GotoIf($["${SERVER_MODE}" = "register"]?reg)
 same => n,MessageSend(pjsip:server/sip:${SERVER_EXT}@${SERVER_HOST}:${SERVER_PORT},<sip:${MSGFROM}@${LOCAL_ADDR}>)
 same => n,Goto(statut)
 same => n(reg),MessageSend(pjsip:server/sip:${SERVER_EXT}@${SERVER_HOST}:${SERVER_PORT},${MSGFROM} <sip:${SERVER_USER}@${SERVER_HOST}>)
 same => n,Goto(statut)
 same => n(local),GotoIf($["${LOCAL_ON}" != "1"]?aucun)
 same => n,Set(MESSAGE(to)=sip:@SIP_USER@)
 same => n,MessageSend(pjsip:@SIP_USER@,<sip:${MSGFROM}@${LOCAL_ADDR}>)
 same => n,Goto(statut)
 same => n(aucun),Set(MESSAGE_SEND_STATUS=FAILURE)
 same => n(statut),GotoIf($["${MSGID}" = ""]?fin)
 same => n,Set(DB(rut360sms/${MSGID}_status)=${MESSAGE_SEND_STATUS})
 same => n(fin),Hangup()
