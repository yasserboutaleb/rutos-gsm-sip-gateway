; rut360gw — Asterisk 18 run from RAM (/tmp/rut360gw); configuration GENERATED by rut360gw-config in /var/run/rut360gw/etc
[directories]
astetcdir => /var/run/rut360gw/etc
astmoddir => /tmp/rut360gw/root/usr/lib/asterisk/modules
astvarlibdir => /tmp/rut360gw/var/lib/asterisk
astdbdir => /tmp/rut360gw/var/lib/asterisk
astkeydir => /tmp/rut360gw/var/lib/asterisk
astdatadir => /tmp/rut360gw/root/usr/share/asterisk
astagidir => /tmp/rut360gw/root/usr/share/asterisk/agi-bin
astspooldir => /tmp/rut360gw/var/spool/asterisk
astrundir => /var/run/rut360gw
astlogdir => /tmp/rut360gw/log
astsbindir => /tmp/rut360gw/root/usr/sbin

[options]
verbose = 2
; no maxload: on this single-core CPU, the RutOS load often exceeds 1 and calls would be refused
minmemfree = 8            ; MB: refuse new calls below this threshold
cache_media_frames = no
transmit_silence = yes
hideconnect = yes
